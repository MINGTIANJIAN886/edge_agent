name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check Python syntax
        run: python3 -m py_compile edge_ocr.py car_bridge.py mqtt_recv_model.py mqtt_send_model.py scripts/bridge_ros1.py scripts/bridge_ros2.py

      - name: Check shell syntax
        run: bash -n agent.sh run.sh scripts/run_bridge.sh

      - name: Run ShellCheck
        run: shellcheck agent.sh run.sh scripts/run_bridge.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            goarm: ""
            suffix: amd64
          - goarch: arm64
            goarm: ""
            suffix: aarch64
          - goarch: arm
            goarm: "7"
            suffix: armv7l
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build agent-${{ matrix.suffix }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -ldflags="-s -w" -o build/agent-${{ matrix.suffix }} ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.suffix }}
          path: build/agent-${{ matrix.suffix }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd build
          sha256sum agent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Edge Agent ${{ github.ref_name }}
          body: Built from ${{ github.sha }}
          files: build/**
          make_latest: true
          fail_on_unmatched_files: false
